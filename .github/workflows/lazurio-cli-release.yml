name: Lazurio CLI Release

# Releases the Lazurio build of the Composio CLI (see LAZURIO.md). Manual only.
# The build and release jobs mirror build-cli-binaries.yml: the same four
# platform archives with the version baked in, the same skill packaging and
# checksums, and the same draft → verify → publish helpers. The release is
# stable and becomes the latest; a final job installs it with this
# repository's install.sh on Linux and macOS.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag @composio/cli@<upstream version>-lazurio.<n>; dispatch on lazurio/cli-<upstream version>'
        required: true
        type: string

# Least privilege by default: only the release job creates/edits releases and uploads assets.
permissions:
  contents: read

# Print Turborepo telemetry events to the logs instead of sending them.
env:
  TURBO_TELEMETRY_DEBUG: 1

jobs:
  prepare:
    name: Validate Release Target
    if: github.repository == 'Lazurio/composio'
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.resolve.outputs.release_name }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      make_latest: ${{ steps.resolve.outputs.make_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      # Refuse anything but @composio/cli@X.Y.Z-lazurio.N dispatched on
      # lazurio/cli-X.Y.Z, a tag that already exists on another commit (tags are
      # never moved), and a release that is already published.
      - name: Validate tag and branch
        id: resolve
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_INPUT" =~ ^@composio/cli@([0-9]+\.[0-9]+\.[0-9]+)-lazurio\.[0-9]+$ ]]; then
            echo "::error::tag must match @composio/cli@<major>.<minor>.<patch>-lazurio.<n> (got '$TAG_INPUT')"
            exit 1
          fi
          upstream_version="${BASH_REMATCH[1]}"

          if [[ "$REF_TYPE" != branch || "$REF_NAME" != lazurio/cli-* ]]; then
            echo "::error::dispatch on a lazurio/cli-* branch (got $REF_TYPE '$REF_NAME')"
            exit 1
          fi
          if [[ "$REF_NAME" != "lazurio/cli-${upstream_version}" ]]; then
            echo "::error::$TAG_INPUT is released from lazurio/cli-${upstream_version}, not '$REF_NAME'"
            exit 1
          fi

          # The last line is the peeled commit of an annotated tag; empty when the tag is new.
          tag_commit=$(git ls-remote origin "refs/tags/${TAG_INPUT}" "refs/tags/${TAG_INPUT}^{}" | tail -n 1 | cut -f 1)
          if [[ -n "$tag_commit" && "$tag_commit" != "$COMMIT_SHA" ]]; then
            echo "::error::tag $TAG_INPUT already points at $tag_commit, not $COMMIT_SHA"
            exit 1
          fi

          # Drafts are invisible to this read-only token; the release job resumes them.
          if is_draft=$(gh release view "$TAG_INPUT" --repo "$REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null) &&
            [[ "$is_draft" != true ]]; then
            echo "::error::release $TAG_INPUT is already published"
            exit 1
          fi

          {
            echo "release_name=CLI ${TAG_INPUT}"
            echo "release_tag=${TAG_INPUT}"
            echo "release_version=${TAG_INPUT#@composio/cli@}"
            echo "prerelease=false"
            echo "make_latest=true"
          } >>"$GITHUB_OUTPUT"

      # The baked toolkit slugs decide whether `composio execute` resolves a
      # toolkit locally or pays for a catalog fetch. A stale list is never
      # wrong, only slow, so this warns and never blocks a release.
      - name: Check baked toolkit slugs freshness
        continue-on-error: true
        run: |
          set -euo pipefail
          refreshed_at=$(sed -n "s/.*BAKED_TOOLKIT_SLUGS_REFRESHED_AT = '\(.*\)'.*/\1/p" \
            ts/packages/cli/src/generated/toolkit-slugs.ts)
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$refreshed_at" +%s) ) / 86400 ))
          echo "Baked toolkit slugs were refreshed $age_days day(s) ago ($refreshed_at)."
          if [ "$age_days" -gt 14 ]; then
            echo "::warning::Baked toolkit slugs are $age_days days old."
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ${{ matrix.runner }}
    strategy:
      # Never publish a partial platform set: the release job runs only when every leg passes.
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            artifact: composio-linux-x64
            runner: ubuntu-latest
          - target: bun-linux-arm64
            artifact: composio-linux-aarch64
            runner: ubuntu-latest
          - target: bun-darwin-x64
            artifact: composio-darwin-x64
            runner: macos-15-intel
          - target: bun-darwin-arm64
            artifact: composio-darwin-aarch64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      # Unlike build-cli-binaries.yml, no COMPOSIO_POSTHOG_PROJECT_API_KEY is
      # set, so no PostHog key is baked into the Lazurio build.
      - name: Cross-compile CLI binary
        working-directory: ts/packages/cli
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: pnpm build:binary:cross --target ${{ matrix.target }}

      - name: Verify binary
        working-directory: ts/packages/cli
        run: |
          ls -la dist/binaries/${{ matrix.artifact }}
          file dist/binaries/${{ matrix.artifact }}

      - name: Verify binary version
        if: matrix.target == 'bun-linux-x64'
        working-directory: ts/packages/cli
        run: |
          expected_version='${{ needs.prepare.outputs.release_tag }}'
          test "$(./dist/binaries/${{ matrix.artifact }} --version)" = "${expected_version#@composio/cli@}"

      - name: Test binary
        if: matrix.target == 'bun-linux-x64'
        working-directory: ts/packages/cli
        env:
          COMPOSIO_USER_API_KEY: test-dummy-api-key-for-ci
        run: |
          ./dist/binaries/${{ matrix.artifact }} --version
          ./dist/binaries/${{ matrix.artifact }} --help | head -5

      - name: Create archive
        working-directory: ts/packages/cli
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: pnpm build:binary:package

      - name: Verify release metadata in archive
        working-directory: ts/packages/cli
        run: unzip -p dist/binaries/${{ matrix.artifact }}.zip ${{ matrix.artifact }}/release-tag.txt | grep -Fx '${{ needs.prepare.outputs.release_tag }}'

      - name: Verify companion layout in archive
        working-directory: ts/packages/cli
        env:
          ARCHIVE: dist/binaries/${{ matrix.artifact }}.zip
          ARTIFACT: ${{ matrix.artifact }}
        run: bash "${{ github.workspace }}/.github/scripts/cli-release/verify-archive-companions.sh"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ts/packages/cli/dist/binaries/${{ matrix.artifact }}.zip
          retention-days: 7

  release:
    name: Release (draft → verify → publish)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/edit the GitHub Release and upload assets
    if: needs.build.result == 'success'
    # Serialize runs that target the same release tag so they cannot interleave uploads.
    concurrency:
      group: cli-release-${{ needs.prepare.outputs.release_tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      MAKE_LATEST: ${{ needs.prepare.outputs.make_latest }}
      CHECKOUT_REF: ${{ github.sha }}
      RELEASE_HELPERS_DIR: ${{ github.workspace }}/.release-workflow/.github/scripts/cli-release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js, pnpm, Bun
        uses: ./.github/actions/setup-node-pnpm-bun

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ts/packages/cli/dist/binaries
          merge-multiple: true

      # Package skills BEFORE generating checksums so composio-skill.zip is included in
      # checksums.txt alongside the platform binaries.
      - name: Package skill files
        working-directory: ts/packages/cli
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          pnpm run validate:skills
          if [[ "$PRERELEASE" == "true" ]]; then
            channel=beta
          else
            channel=stable
          fi
          pnpm run build:skills -- --channel "$channel" --output-dir ./dist/skills
          cd dist/skills && zip -r ../binaries/composio-skill.zip composio-cli/

      - name: Generate checksums
        working-directory: ts/packages/cli
        run: bun run ./scripts/generate-checksums.ts

      - name: Display checksums
        run: cat ts/packages/cli/dist/binaries/checksums.txt

      - name: Checkout workflow release helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: |
            .github/scripts/cli-release
          sparse-checkout-cone-mode: false

      # Tags are never moved: a draft left by an earlier run of this tag must
      # target this commit, or publishing it would tag a different commit than
      # the one these archives were built from.
      - name: Refuse a draft of this tag from another commit
        run: |
          set -euo pipefail
          draft_target=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish \
            --jq 'select(.isDraft) | .targetCommitish' 2>/dev/null || true)
          if [[ -n "$draft_target" && "$draft_target" != "$CHECKOUT_REF" ]]; then
            echo "::error::Draft $RELEASE_TAG targets $draft_target, not $CHECKOUT_REF. Delete that draft or dispatch from its commit."
            exit 1
          fi

      - name: Create draft release with all assets
        run: bash "$RELEASE_HELPERS_DIR/create-or-resume-draft.sh"

      - name: Verify all release assets are present and uploaded
        run: bash "$RELEASE_HELPERS_DIR/verify-assets.sh"

      # Publishing is the only step that exposes the release.
      - name: Publish release (flip draft → published)
        run: gh release edit "$RELEASE_TAG" --draft=false --latest="$MAKE_LATEST"

  verify-install:
    name: Install with install.sh (${{ matrix.os }})
    needs: [prepare, release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install the published release
        env:
          COMPOSIO_GITHUB_OWNER: Lazurio
          COMPOSIO_GITHUB_REPO: composio
          COMPOSIO_INSTALL_VERSION: ${{ needs.prepare.outputs.release_tag }}
          COMPOSIO_INSTALL_PLUGINS: '0'
          COMPOSIO_INSTALL_SHELL: none
          COMPOSIO_INSTALL_HELP: '0'
        run: sh install.sh

      - name: Verify the installed CLI
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          composio="$HOME/.local/bin/composio"

          version=$("$composio" --version)
          echo "composio --version: $version"
          test "$version" = "${RELEASE_TAG#@composio/cli@}"

          remove_help=$("$composio" connections remove --help 2>&1)
          printf '%s\n' "$remove_help"
          grep -qF -- '--yes' <<<"$remove_help"
